name: relays
on:
  pull_request:
    paths: ["relays/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check (pull request)
        if: github.event_name == 'pull_request'
        run: python3 relays/check_relays.py relays/relays.json
      - name: nightly probe
        if: github.event_name != 'pull_request'
        run: |
          python3 relays/check_relays.py relays/relays.json --nightly || true
          if ! git diff --quiet; then
            git config user.name "relay-check"; git config user.email "actions@users.noreply.github.com"
            git commit -am "relays: nightly probe" && git push
          fi
